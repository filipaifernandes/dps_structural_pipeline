threads: 4

query:
  interpro_ids:
    - IPR002177   # DPS family — DNA-binding protein from starved cells
    - IPR014490   # DPS-like family — archaeal/alternative DPS

  manual_include:
    - pdb_id: 1zuj
      reason: "Lactococcus lactis DpsA - genuine DPS paralog, not annotated in InterPro"
    - pdb_id: 1zs3
      reason: "Lactococcus lactis DpsB - genuine DPS paralog, not annotated in InterPro"

  uniprot_blacklist:
    - accession: P0DTC2
      reason: "SARS-CoV-2 spike protein - InterPro annotation error"

  pdb_blacklist:
    - pdb_id: 8fa2
      reason: "Mis-annotated non-DPS structure"
    - pdb_id: 3ak9
      reason: "Lower-resolution duplicate of 3ak8 (Salmonella enterica, 1.30 A vs 1.25 A) - lacks UniProt annotation so automatic dedup cannot remove it"

sifts_max_age_days: 30
batch_size: 50
